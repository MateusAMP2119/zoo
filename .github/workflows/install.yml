# runs the one-line installers on fresh windows, macos and linux runners and checks `zoo` starts claude code.
name: install

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      # each os's default shell: zsh on macos, bash on linux.
      SHELL: ${{ startsWith(matrix.os, 'macos') && '/bin/zsh' || '/bin/bash' }}
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh | ZOO_REPO=${{ github.repository }} sh
      # a new interactive shell picks up path like a new terminal; claude code refusing to start without one proves zoo reached it.
      - shell: bash
        run: |
          $SHELL -ic 'command -v zoo && command -v claude && zoo </dev/null' 2>&1 | tee out.txt || true
          grep -q 'Input must be provided' out.txt

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: pwsh
        run: |
          $env:ZOO_REPO = '${{ github.repository }}'
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1 | iex
      - shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          (Get-Command zoo).Source
          (Get-Command claude).Source
          $out = (cmd /c 'zoo < NUL 2>&1') -join "`n"
          $out
          if ($out -notmatch 'Input must be provided') { exit 1 }
          exit 0
